name: link-to-linux
base: core24
version: '1.0'
summary: Connect your Android phone to your Linux desktop
description: |
  Link to Linux provides a graphical interface for pairing an Android
  device with a Linux desktop using a QR code.

grade: stable
confinement: strict

apps:
  link-to-linux:
    command: bin/link-to-linux
    extensions:
      - gnome
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
      GI_TYPELIB_PATH: $SNAP/usr/lib/x86_64-linux-gnu/girepository-1.0
    plugs:
      - network
      - network-bind
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11

parts:
  link-to-linux:
    plugin: dump
    source: .
    stage-packages:
      - python3
      - python3-gi
      - python3-qrcode
      - python3-pil
      - gir1.2-gtk-4.0
