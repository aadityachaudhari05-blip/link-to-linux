name: link-to-linux
base: core24
version: '1.1'
summary: Connect your Android phone to your Linux desktop
description: |
  Link to Linux lets you pair an Android device with a Linux desktop
  using a QR code and a local Wi-Fi connection.

grade: stable
confinement: strict

apps:
  link-to-linux:
    command: bin/link-to-linux
    extensions:
      - gnome
    environment:
      PYTHONPATH: $SNAP/usr/lib/python3/dist-packages
      GI_TYPELIB_PATH: $SNAP/usr/lib/x86_64-linux-gnu/girepository-1.0
    plugs:
      - network
      - network-bind
      - home
      - desktop
      - desktop-legacy
      - wayland
      - x11
    slots:
      - dbus-com.mrunu.LinkToLinux

slots:
  dbus-com.mrunu.LinkToLinux:
    interface: dbus
    bus: session
    name: com.mrunu.LinkToLinux

parts:
  link-to-linux:
    plugin: dump
    source: .
    stage-packages:
      - python3
      - python3-gi
      - python3-qrcode
      - python3-pil
      - python3-flask
      - gir1.2-gtk-4.0
