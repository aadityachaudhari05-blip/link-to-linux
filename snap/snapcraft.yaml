name: link-to-linux
base: core24
version: '1.0'
summary: Effortlessly bridge and sync your Android device with Linux desktop
description: |
  Link to Linux provides a seamless wireless connection experience for your desktop.
  Generate a pairing QR code instantly to connect, transfer files, and monitor data.

grade: stable
confinement: strict

apps:
  link-to-linux:
    command: bin/python3 $SNAP/app.py
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home

parts:
  link-to-linux:
    plugin: dump
    source: .
    stage-packages:
      - python3-qrcode
      - python3-pillow
